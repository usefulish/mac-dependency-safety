# Layer 0h — ripgrep config for pi's `grep` tool. Install to /etc/pi/ripgrep.conf
# (root:wheel 0644). dependency-safety.ts exports RIPGREP_CONFIG_PATH=/etc/pi/
# ripgrep.conf into the pi process, so the `grep` tool (which spawns rg
# --hidden, outside the bash sandbox) skips secret files instead of quoting
# their contents into the model context. One flag per line, no quoting.
#
# Two limits, both enforced by the extension's tool_call hook instead:
#   - rg's last matching glob wins and the tool's own `glob` argument comes
#     AFTER this file, so a user glob such as `**` re-includes everything
#     excluded here — the hook rejects globs that would match a secret name.
#   - an explicit file operand (`grep pattern .env`) puts rg in single-file
#     mode where --glob exclusions do not apply — the hook applies the read
#     tool's deny set to grep targets.
# Keep the list in step with DENIED_DIRS / DENIED_FILES in dependency-safety.ts.
--glob=!.env
--glob=!.env.*
--glob=!.envrc
--glob=!.npmrc
--glob=!.netrc
--glob=!.git-credentials
--glob=!.pypirc
--glob=!**/.ssh/**
--glob=!**/.aws/**
--glob=!**/.gnupg/**
--glob=!**/.kube/**
--glob=!**/.config/gcloud/**
--glob=!**/.config/gh/**
--glob=!**/Library/Keychains/**
--glob=!**/.docker/config.json
--glob=!**/auth.json
--glob=!**/.credentials.json
--glob=!**/.bitcoin/**
--glob=!**/.ethereum/**
--glob=!**/.electrum/**
--glob=!**/.config/solana/**
--glob=!**/Library/Application Support/Bitcoin/**
--glob=!**/Library/Application Support/Electrum/**
--glob=!**/Library/Application Support/Exodus/**
--glob=!**/Library/Application Support/Ledger Live/**
