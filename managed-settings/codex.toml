allowed_sandbox_modes = ["read-only", "workspace-write"]
allowed_approval_policies = ["untrusted", "on-request"]

# Write-scope ceiling (knowfleet record d0b38a31). Without this, ANY profile
# defined in the user-writable ~/.codex/config.toml is selectable — a
# `"~/" = "write"` profile granted $HOME-wide write even under managed config.
#
# Schema note (verified 2026-08-15, codex-cli 0.147.0): this is a MAP of
# profile name -> bool, not a list. A list fails with "invalid type: sequence,
# expected a map". Every name listed must already exist — built-ins, or a
# profile defined in user config — or Codex refuses to start with
# "allowed_permission_profiles refers to undefined profile". repo-git is the
# audited .git relaxation (80b1ce43); install it in ~/.codex/config.toml FIRST.
[allowed_permission_profiles]
":read-only"           = true
":workspace"           = true
"repo-git"             = true
":danger-full-access"  = false

[permissions.filesystem]
# ~/.npmrc is denied deliberately (registry tokens) — with the measured
# consequence (task #284, 2026-08-30, codex-cli 0.150.1) that npm inside a
# Codex sandbox reports ignore-scripts=false: Layer 1's guard lives in that
# file, and npm treats an unreadable user config as absent. Accepted, because
# the deny cannot be narrowed: "~/**/.npmrc" matches "~/.npmrc" itself
# (zero-segment glob, probed live), no allow_read key exists, and a -c
# override cannot weaken the managed list — exempting the home file would
# also exempt every project .npmrc under ~. Do not remove the "~/.npmrc"
# entry alone expecting an exemption: the glob still matches it. Known gap:
# the ~/-rooted globs do not cover .npmrc outside $HOME (e.g. /tmp checkouts).
deny_read = [
  "~/.ssh",
  "~/.aws",
  "~/.config/gcloud",
  "~/.config/gh",
  "~/.npmrc",
  "~/.netrc",
  "~/.git-credentials",
  "~/.docker/config.json",
  "~/.kube/config",
  "~/**/.env",
  "~/**/.env.*",
  "~/**/.npmrc",
]
